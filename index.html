<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閃耀礦坑 · Shimmering Mine</title>
<!--
  入口頁：先選語言，再進入真正的遊戲（game.html）。
  這一頁只有一張圖和兩顆按鈕，所以地圖、模型、音樂都要等選完才會開始下載。
  舊網址 index.html?lang=en / ?lang=zh 會直接轉進遊戲，不再問一次。
-->
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') location.replace('game.html?lang=' + q);
  })();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05060b; }
  body { display:flex; align-items:center; justify-content:center;
    font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
  .frame { position:relative; height:100%; aspect-ratio:9/16; max-width:100%;
    background:#070b15 url('images/Loading.png') center top / cover no-repeat; overflow:hidden; }
  .shade { position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(5,6,11,0) 45%, rgba(5,6,11,.82) 72%, rgba(5,6,11,.95)); }
  .box { position:absolute; left:0; right:0; bottom:9%; display:flex; flex-direction:column;
    align-items:center; gap:22px; padding:0 16px; }
  .ask { color:#ffe0ad; font-size:15px; letter-spacing:2px; text-align:center;
    text-shadow:0 2px 8px rgba(0,0,0,.8); margin-bottom:4px; }
  .lang { display:block; width:min(208px, 62%); padding:12px 0; border-radius:11px; text-align:center;
    text-decoration:none; font-weight:900; font-size:17px; letter-spacing:2px; color:#3a2306;
    -webkit-text-stroke:.6px #3a2306;   /* 微軟正黑體最粗只到 Bold，再描一圈細邊讓字更粗 */
    background:linear-gradient(#ffe48a, #f2b33d); border:2px solid #fff1b8;
    box-shadow:0 5px 0 #a8681a, 0 8px 20px rgba(0,0,0,.55); transition:transform .08s; }
  .lang:active { transform:translateY(3px); box-shadow:0 2px 0 #a8681a, 0 5px 12px rgba(0,0,0,.5); }
  .lang.last { outline:3px solid rgba(126,224,255,.75); outline-offset:3px; }
</style>
</head>
<body>
<div class="frame">
  <div class="shade"></div>
  <div class="box">
    <div class="ask">選擇語言　·　Choose your language</div>
    <a class="lang" data-lang="zh" href="game.html?lang=zh">中文</a>
    <a class="lang" data-lang="en" href="game.html?lang=en">English</a>
  </div>
</div>
<script>
  // 上次選的語言加一圈藍框，方便直接點
  try {
    var last = localStorage.getItem('mole-mine-lang');
    var el = last && document.querySelector('.lang[data-lang="' + last + '"]');
    if (el) el.classList.add('last');
  } catch (_) {}
</script>
</body>
</html>
